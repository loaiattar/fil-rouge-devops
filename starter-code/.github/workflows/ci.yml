name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci && npm test

  build:
    needs: test
    uses: ./.github/workflows/reuseable-docker.yml
    with:
      image-name: devops-app
      context: ./app

  install-terraform:
    needs: build
    runs-on: ubuntu-latests
    name: a job to install terraform
    steps:
      - uses: actions/checkout@v4
      - id: terraform
        uses: PANDORMedia/setup-tools@latest
        with:
          install-terraform: "true"

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  deploy-staging:
    needs: [build, security]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Use secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Secrets are masked in log"
          echo "DB_PASSWORD length: ${#DB_PASSWORD}"
      - run: echo "Deploying to staging..."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Use secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Secrets are masked in log"
          echo "DB_PASSWORD length: ${#DB_PASSWORD}"
      - run: echo "Deploying to production..."
